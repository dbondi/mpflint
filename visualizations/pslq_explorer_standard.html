<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>PSLQ Explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'SF Mono',Consolas,monospace;background:#0d1117;color:#c9d1d9;font-size:12px}

/* header */
header{background:#161b22;padding:8px 16px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:16px}
header h1{font-size:14px;color:#58a6ff;font-weight:600}
header .info{color:#8b949e;font-size:11px;flex:1}
.solve-btn{padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600;
  background:#238636;color:#fff;border:1px solid #2ea043}
.solve-btn:hover{background:#2ea043}
.solve-btn.loading{background:#21262d;color:#8b949e;border-color:#30363d;cursor:wait}

/* layout */
.wrap{display:flex;height:calc(100vh - 38px)}

/* sidebar */
.side{width:140px;background:#161b22;border-right:1px solid #30363d;overflow-y:auto;flex-shrink:0}
.it{padding:5px 8px;cursor:pointer;font-size:10px;color:#8b949e;border-bottom:1px solid #21262d;display:flex;justify-content:space-between}
.it:hover{background:#1c2128}.it.on{background:#1f3a5f;color:#58a6ff}

/* phase bar */
.pbar{background:#161b22;border-bottom:1px solid #30363d;padding:6px 12px;display:flex;gap:6px}
.pbtn{padding:3px 10px;border-radius:3px;cursor:pointer;font-size:10px;background:#21262d;color:#8b949e;border:1px solid #30363d}
.pbtn:hover{border-color:#58a6ff}.pbtn.on{background:#1f3a5f;color:#58a6ff;border-color:#58a6ff}
.sbtn{padding:2px 8px;border-radius:3px;cursor:pointer;font-size:10px;background:#21262d;color:#8b949e;border:1px solid #30363d}
.sbtn:hover{border-color:#58a6ff;color:#c9d1d9}
.sbtn.apply{background:#1a4d2e;color:#3fb950;border-color:#238636}
.sbtn.apply:hover{background:#238636;color:#fff}
.sbtn.undo{background:#3d1f00;color:#f0883e;border-color:#9e6a03}
.sbtn.reset{background:#3d0e0e;color:#f85149;border-color:#da3633}
.step-count{font-size:9px;color:#8b949e;padding:2px 6px}

/* main content */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.cols{flex:1;display:flex;flex-direction:column;overflow-y:auto}

/* top row: diagonal + swap */
.left{display:flex;flex-direction:column;border-bottom:1px solid #30363d}

/* bottom row: matrix + y */
.right{padding:8px}

/* sections */
.sec{padding:8px}
.sec h3{font-size:10px;color:#8b949e;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}

/* swap panel */
#swap-panel{padding:8px}
#swap-panel h3{font-size:10px;color:#8b949e;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.swap-info{color:#8b949e;font-size:11px;margin-bottom:4px}
.sr{display:flex;align-items:center;height:15px;font-size:9px;margin:1px 0}
.sr:hover{background:rgba(255,255,255,.06)}
.sr.sel{background:rgba(88,166,255,.18);border-left:3px solid #58a6ff}
.sr.sel .sl{color:#58a6ff;font-weight:bold}
.sr .sl{width:16px;text-align:right;color:#484f58;margin-right:3px;flex-shrink:0}
.sr .sb{flex:1;height:11px;position:relative;background:#161b22;border-radius:1px}
.sr .sf{height:100%;border-radius:1px;position:relative;z-index:1}
.sr .sg{position:absolute;top:0;left:0;height:100%;border-radius:1px;background:rgba(248,81,73,.35);border-right:2px solid #f85149;z-index:2}
.sr .sv{position:absolute;right:2px;top:0;font-size:7px;color:#6e7681;line-height:11px;z-index:3}

/* matrix */
.mgrid{display:grid;gap:1px;width:max-content}
.mc{height:13px;cursor:default;position:relative;border-radius:1px}
.mc:hover::after{content:attr(data-t);position:absolute;left:100%;top:-2px;margin-left:4px;
  background:#30363d;color:#e6edf3;padding:2px 6px;border-radius:3px;font-size:10px;white-space:nowrap;z-index:20;pointer-events:none}

/* y bars */
.yrow{display:flex;align-items:center;height:13px;margin:1px 0}
.yrow .yl{width:16px;text-align:right;font-size:9px;color:#484f58;margin-right:3px}
.yrow .yw{flex:1;height:10px;position:relative;background:#161b22;border-radius:1px}
.yrow .yf{height:100%;border-radius:1px;position:relative;z-index:1}
.yrow .sg{position:absolute;top:0;left:0;height:100%;border-radius:1px;background:rgba(248,81,73,.35);border-right:2px solid #f85149;z-index:2}
.yrow .yv{position:absolute;right:2px;top:0;font-size:7px;color:#6e7681;line-height:10px;z-index:3}
.yrow.sel{background:rgba(88,166,255,.18);border-left:3px solid #58a6ff}

/* history panel (right sidebar) */
.hist{width:280px;background:#161b22;border-left:1px solid #30363d;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.hist-hdr{padding:6px 8px;border-bottom:1px solid #30363d;display:flex;align-items:center;justify-content:space-between}
.hist-hdr h3{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px}
.hist-clear{font-size:9px;color:#484f58;cursor:pointer;padding:2px 6px;border-radius:3px;border:1px solid #30363d}
.hist-clear:hover{color:#f85149;border-color:#f85149}
.hist-body{flex:1;overflow-y:auto;padding:4px}
.hist-entry{background:#0d1117;border:1px solid #21262d;border-radius:4px;padding:6px 8px;margin-bottom:4px;font-size:10px}
.hist-entry.latest{border-color:#30363d}
.hist-meta{color:#484f58;margin-bottom:4px;display:flex;justify-content:space-between}
.hist-meta .tag{padding:1px 4px;border-radius:2px;background:#21262d;color:#8b949e}
.solve-row{display:flex;align-items:center;padding:2px 0;font-size:10px}
.solve-name{flex:1;color:#c9d1d9}
.strat-link{cursor:pointer;text-decoration:underline;text-decoration-color:#30363d}
.strat-link:hover{color:#58a6ff;text-decoration-color:#58a6ff}
.solve-iters{width:60px;text-align:right;font-weight:600}
.solve-iters.found{color:#3fb950}
.solve-iters.fail{color:#f85149}
.solve-time{width:50px;text-align:right;color:#484f58;font-size:9px}
.solve-loading{color:#8b949e;font-size:11px;padding:8px}
.hist-swaps{display:none;padding-top:4px;border-top:1px solid #21262d;margin-top:4px;flex-wrap:wrap;gap:3px}
.hist-entry.open .hist-swaps{display:flex}
.swap-tag{font-size:9px;padding:1px 5px;border-radius:3px;background:#1f1d2e;color:#d2a8ff;border:1px solid #30363d}
</style></head><body>

<header>
  <h1>PSLQ Explorer</h1>
  <div class="info" id="info"></div>
  <div class="solve-btn" id="back-btn" onclick="backToOriginal()" style="display:none;background:#21262d;border-color:#30363d">← Back</div>

<div class="wrap">

</div>

const n=T.n,gamma=T.gamma;
let its=T.iterations,origIts=its,viewLabel=null;
let ci=0,cp='start',sel1=-1,sel2=-1;
let sandbox={active:false,H:null,y:null,perm:null,history:[],swaps:[]};

function updateInfo(){
  const info=document.getElementById('info');
  if(viewLabel){
    info.textContent=`${viewLabel} — ${its.length} iters`;
    info.style.color='#d2a8ff';
  } else {
    info.textContent=`n=${n} mpr=${T.mpr} ${its.length} iters ${T.found?'FOUND':'FAIL'}`+(T.relation?` [${T.relation}]`:'');
    info.style.color='#8b949e';
  }
  document.getElementById('back-btn').style.display=viewLabel?'block':'none';
}
updateInfo();

function sandboxApply(){
  if(sel1<0||sel2<0)return;
  const curH=sandbox.active?sandbox.H:gH(cp);
  const curY=sandbox.active?sandbox.y:gY(cp);
  const curP=sandbox.active?sandbox.perm:(gP(cp)||[...Array(n).keys()]);
  sandbox.history.push({H:curH.map(r=>r.slice()),y:curY.slice(),perm:curP.slice()});
  sandbox.swaps.push([sel1,sel2]);
  const sw=swapHY(curH,curY,sel1,sel2,curP);
  sandbox.H=sw.H;sandbox.y=sw.y;sandbox.perm=sw.p;
  sandbox.active=true;sel1=sel2=-1;render();
}
function sandboxUndo(){
  if(!sandbox.history.length)return;
  const prev=sandbox.history.pop();
  sandbox.swaps.pop();
  sandbox.H=prev.H;sandbox.y=prev.y;sandbox.perm=prev.perm;
  if(!sandbox.history.length)sandbox.active=false;
  sel1=sel2=-1;render();
}
function sandboxReset(){
  sandbox={active:false,H:null,y:null,perm:null,history:[],swaps:[]};
  sel1=sel2=-1;render();
}

// sidebar
const side=document.getElementById('side');
function buildSidebar(){
  side.innerHTML='';
  its.forEach((t,i)=>{
    const d=document.createElement('div');d.className='it'+(i===ci?' on':'');
    d.innerHTML=`<span>${t.iter}</span><span>${t.min_y.toExponential(1)}</span>`;
    d.onclick=()=>{ci=i;cp='start';sel1=sel2=-1;sandboxReset()};side.appendChild(d)});
}
buildSidebar();

function recomputeLogRange(){
  gMx=-Infinity;gMn=Infinity;
  its.forEach(t=>{[t.H_start,t.H_end].forEach(H=>H.forEach((r,i)=>{
    if(i<r.length){let v=Math.abs(r[i]);if(v>0){let l=Math.log10(v);if(l>gMx)gMx=l;if(l<gMn)gMn=l}}}))});
  gMn=Math.floor(gMn)-1;gMx=Math.ceil(gMx)+1;
}

function viewStrategy(histEntry, stratName){
  const btn=document.getElementById('solve-btn');
  btn.classList.add('loading');btn.textContent='Loading trace...';
  fetch('/trace',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({iter:histEntry.iter,phase:histEntry.phase,swaps:histEntry.swaps||[],
      strategy:stratName,max_iter:histEntry.max_iter||200})
  }).then(r=>r.json()).then(data=>{
    btn.classList.remove('loading');btn.textContent='Solve from here';
    its=data.iterations;viewLabel=stratName;
    ci=0;cp='start';sel1=sel2=-1;
    sandbox={active:false,H:null,y:null,perm:null,history:[],swaps:[]};
    recomputeLogRange();buildSidebar();updateInfo();render();
  }).catch(err=>{
    btn.classList.remove('loading');btn.textContent='Solve from here';
    alert('Trace error: '+err.message);
  });
}

function backToOriginal(){
  its=origIts;viewLabel=null;
  ci=0;cp='start';sel1=sel2=-1;
  sandbox={active:false,H:null,y:null,perm:null,history:[],swaps:[]};
  recomputeLogRange();buildSidebar();updateInfo();render();
}

function gH(p){const t=its[ci];return p==='start'?t.H_start:p==='swaps'?t.H_swaps:p==='hermite'?t.H_herm:t.H_end}
function gY(p){const t=its[ci];return p==='start'?t.y_start:p==='swaps'?t.y_swaps:p==='hermite'?t.y_herm:t.y_end}
function gP(p){const t=its[ci];if(!t.perm_start)return null;return p==='start'?t.perm_start:p==='swaps'?t.perm_swaps:p==='hermite'?t.perm_herm:t.perm_end}
function rowClr(origIdx){const t=origIdx/(n-1);const h=0+t*120;return `hsl(${h},80%,50%)`}
function diag(H){const d=[];for(let i=0;i<n-1;i++)d.push(Math.abs(H[i][i]));return d}

function swapGivens(H,y,j){
  const c=H[0].length;
  for(let k=0;k<c;k++){let t=H[j][k];H[j][k]=H[j+1][k];H[j+1][k]=t}
  let t=y[j];y[j]=y[j+1];y[j+1]=t;
  if(j<n-2){let a=H[j][j],b=H[j][j+1],d=Math.hypot(a,b);
    if(d>1e-30){let cs=a/d,sn=b/d;
      for(let i=0;i<n;i++){let h0=H[i][j],h1=H[i][j+1];H[i][j]=h0*cs+h1*sn;H[i][j+1]=-h0*sn+h1*cs}}}
}
function swapHY(Hin,yv,r1,r2,pin){
  const H=Hin.map(r=>r.slice()),y=yv.slice();
  const p=pin?pin.slice():null;
  let a=Math.min(r1,r2),b=Math.max(r1,r2);
  for(let j=a;j<b;j++){swapGivens(H,y,j);if(p){let t=p[j];p[j]=p[j+1];p[j+1]=t}}
  for(let j=b-2;j>=a;j--){swapGivens(H,y,j);if(p){let t=p[j];p[j]=p[j+1];p[j+1]=t}}
  return {H,y,p};
}

// global log range
let gMx=-Infinity,gMn=Infinity;
its.forEach(t=>{[t.H_start,t.H_end].forEach(H=>H.forEach((r,i)=>{
  if(i<r.length){let v=Math.abs(r[i]);if(v>0){let l=Math.log10(v);if(l>gMx)gMx=l;if(l<gMn)gMn=l}}}))});
gMn=Math.floor(gMn)-1;gMx=Math.ceil(gMx)+1;

function render(){
  const t=its[ci];
  // sidebar
  side.querySelectorAll('.it').forEach((e,i)=>e.className='it'+(i===ci?' on':''));
  side.children[ci]?.scrollIntoView({block:'nearest'});
  // phase bar
  const pb=document.getElementById('pbar');pb.innerHTML='';
  [['start','Start'],['swaps',`Swaps (${t.pairs.length})`],['hermite','Hermite'],['end',`End (${t.nudges}n)`]].forEach(([k,l])=>{
    const b=document.createElement('div');b.className='pbtn'+(k===cp?' on':'');b.textContent=l;
    b.onclick=()=>{cp=k;sel1=sel2=-1;sandboxReset()};pb.appendChild(b)});

  const baseH=gH(cp),baseY=gY(cp);
  const H=sandbox.active?sandbox.H:baseH;
  const yv=sandbox.active?sandbox.y:baseY;
  const curPerm=sandbox.active?sandbox.perm:(gP(cp)||[...Array(n).keys()]);
  const dg=diag(H);
  const ps=new Set();if(cp==='swaps'&&!sandbox.active)t.pairs.forEach(p=>{ps.add(p);ps.add(p+1)});

  const hasPair=sel1>=0&&sel2>=0;
  const sw=hasPair?swapHY(H,yv,sel1,sel2,curPerm):null;
  const da=sw?diag(sw.H):null;

  // sandbox buttons
  const sb=document.getElementById('sandbox-btns');sb.innerHTML='';
  if(sandbox.active){
    sb.innerHTML=`<span class="step-count">${sandbox.history.length} step${sandbox.history.length!==1?'s':''}</span>`;
  }
  if(hasPair){const b=document.createElement('div');b.className='sbtn apply';b.textContent='Apply ↵';b.onclick=sandboxApply;sb.appendChild(b)}
  if(sandbox.history.length){
    const u=document.createElement('div');u.className='sbtn undo';u.textContent='Undo';u.onclick=sandboxUndo;sb.appendChild(u);
    const r=document.createElement('div');r.className='sbtn reset';r.textContent='Reset';r.onclick=sandboxReset;sb.appendChild(r);
  }

  const baseDg=sandbox.active?diag(baseH):null;
  drawDiag(dg,da,ps,baseDg,curPerm,sw?sw.p:null);
  drawY(yv,sw?sw.y:null,t.min_j);
  drawMatrix(H,sw?sw.H:null);
}

function handleClick(j){
  if(j===sel1){sel1=sel2;sel2=-1}
  else if(j===sel2){sel2=-1}
  else if(sel1<0){sel1=j}
  else if(sel2<0){sel2=j}
  else{sel1=j;sel2=-1}
  render();
}

function drawDiag(dg,da,ps,baseDg,perm,ghostPerm){
  const sc=document.getElementById('scols'),si=document.getElementById('sinfo');
  si.textContent=sel1>=0&&sel2>=0?`Swap rows ${sel1} ↔ ${sel2}`:sel1>=0?`Row ${sel1} selected — click another`:'';
  const diagSum=dg.reduce((a,b)=>a+b,0);
  const diagProd=dg.reduce((a,b)=>a*b,1);
  const ds=document.getElementById('diag-sum'),dp=document.getElementById('diag-prod');
  let stxt=`Σ=${diagSum.toExponential(3)}`,ptxt=`Π=${diagProd.toExponential(3)}`;
  if(baseDg){const rs=baseDg.reduce((a,b)=>a+b,0);const rp=baseDg.reduce((a,b)=>a*b,1);
    const sd=diagSum-rs,sp=(sd/rs*100),pd=diagProd-rp,pp=(pd/rp*100);
    stxt+=` <span style="color:#8b949e;font-size:9px">(reset: ${rs.toExponential(3)}, ${sd>0?'+':''}${sp.toFixed(1)}%)</span>`;
    ptxt+=` <span style="color:#8b949e;font-size:9px">(reset: ${rp.toExponential(3)}, ${pd>0?'+':''}${pp.toFixed(1)}%)</span>`}
  if(da){const gs=da.reduce((a,b)=>a+b,0);const gp=da.reduce((a,b)=>a*b,1);
    const sd=gs-diagSum,sp=(sd/diagSum*100),pd=gp-diagProd,pp=(pd/diagProd*100);
    stxt+=` → <span style="color:${sd<0?'#3fb950':'#f85149'}">${gs.toExponential(3)} (${sd>0?'+':''}${sp.toFixed(1)}%)</span>`;
    ptxt+=` → <span style="color:${pd<0?'#3fb950':'#f85149'}">${gp.toExponential(3)} (${pd>0?'+':''}${pp.toFixed(1)}%)</span>`}
  ds.innerHTML=stxt;dp.innerHTML=ptxt;

  let h='';
  for(let k=0;k<n-1;k++){
    const lv=dg[k]>0?Math.log10(dg[k]):gMn;
    const w=Math.max(0,((lv-gMn)/(gMx-gMn))*100);
    const c=perm?rowClr(perm[k]):(ps.has(k)?'#f85149':'#58a6ff');
    const isSel=k===sel1||k===sel2;
    const origLbl=perm?perm[k]:'';
    let ghost='';
    if(da){
      const chg=Math.abs(da[k]-dg[k])/(dg[k]+1e-300)>.001;
      if(chg){
        const lv2=da[k]>0?Math.log10(da[k]):gMn;
        const w2=Math.max(0,((lv2-gMn)/(gMx-gMn))*100);
        const gc=ghostPerm?rowClr(ghostPerm[k]):'rgba(248,81,73,.35)';
        ghost=`<div class="sg" style="width:${w2}%;background:${gc};opacity:0.5;border-right:2px solid ${gc}"></div>`;
      }
    }
    h+=`<div class="sr${isSel?' sel':''}" data-j="${k}" style="cursor:pointer"><div class="sl">${k}</div><div class="sb">${ghost}<div class="sf" style="width:${w}%;background:${c}"></div><div class="sv">${dg[k].toExponential(1)}${origLbl!==''&&origLbl!==k?' ←'+origLbl:''}</div></div></div>`;
  }
  sc.innerHTML=h;

  sc.querySelectorAll('.sr[data-j]').forEach(el=>{
    el.onclick=()=>handleClick(parseInt(el.dataset.j));
  });
}

function drawY(yv,yaAfter,minJ){
  const el=document.getElementById('ybars');el.innerHTML='';
  const ya=yv.map(v=>Math.abs(v));
  const pos=ya.filter(v=>v>0);
  if(!pos.length)return;
  const lmn=Math.log10(Math.min(...pos))-1,lmx=Math.log10(Math.max(...pos))+1;
  const ya2=yaAfter?yaAfter.map(v=>Math.abs(v)):null;
  for(let j=0;j<n;j++){
    const lv=ya[j]>0?Math.log10(ya[j]):lmn;
    const w=Math.max(0,(lv-lmn)/(lmx-lmn)*100);
    const c=j===minJ&&cp==='end'?'#3fb950':'#58a6ff';
    let ghost='';
    if(ya2){
      const chg=Math.abs(ya2[j]-ya[j])/(ya[j]+1e-300)>.001;
      if(chg){
        const lv2=ya2[j]>0?Math.log10(ya2[j]):lmn;
        const w2=Math.max(0,(lv2-lmn)/(lmx-lmn)*100);
        ghost=`<div class="sg" style="width:${w2}%"></div>`;
      }
    }
    const isSel=j===sel1||j===sel2;
    const d=document.createElement('div');d.className='yrow'+(isSel?' sel':'');
    d.innerHTML=`<div class="yl">${j}</div><div class="yw">${ghost}<div class="yf" style="width:${w}%;background:${c}"></div><div class="yv">${ya[j].toExponential(1)}</div></div>`;
    el.appendChild(d);
  }
}

function drawMatrix(H,Ha){
  const mg=document.getElementById('mgrid');mg.innerHTML='';
  const cols=n-1,cw=17;
  mg.style.gridTemplateColumns=`18px repeat(${cols},${cw}px)`;
  let mn=Infinity,mx=-Infinity;
  H.forEach((r,i)=>r.forEach((v,j)=>{if(j<cols){let a=Math.abs(v);if(a>0){let l=Math.log10(a);if(l<mn)mn=l;if(l>mx)mx=l}}}));

  for(let i=0;i<n;i++){
    const rowSel=i===sel1||i===sel2;
    const rl=document.createElement('div');
    rl.style.cssText='font-size:8px;text-align:right;line-height:13px;padding-right:2px;color:'+(rowSel?'#58a6ff':'#484f58');
    rl.textContent=i;mg.appendChild(rl);
    for(let j=0;j<cols;j++){
      const c=document.createElement('div');c.className='mc';c.style.width=cw+'px';
      const v=H[i][j],a=Math.abs(v);
      const chg=Ha&&Math.abs(Ha[i][j]-v)/(a+1e-300)>.001;
      c.setAttribute('data-t',`[${i},${j}] ${v.toExponential(3)}`+(chg?` → ${Ha[i][j].toExponential(3)}`:''));
      if(a>0){const t=(Math.log10(a)-mn)/(mx-mn+1e-10);
        c.style.background=v>=0?`rgb(${13+80*t|0},${17+60*t|0},${23+120*t|0})`:`rgb(${40+100*t|0},${15+20*t|0},${15+20*t|0})`}
      else c.style.background='#0d1117';
      if(i===j)c.style.outline='1px solid rgba(255,255,255,.2)';
      if(chg)c.style.outline='1px solid #f85149';
      mg.appendChild(c);
    }
  }
}

// ── Solve + History ────────────────────────────────────────────────────────

let solveHistory=[];

function renderHistory(){
  const body=document.getElementById('hist-body');
  if(!solveHistory.length){body.innerHTML='<div class="solve-loading">No runs yet</div>';return}
  let h='';
  for(let i=solveHistory.length-1;i>=0;i--){
    const e=solveHistory[i];
    const latest=i===solveHistory.length-1;
    const swapStr=e.swaps&&e.swaps.length?` +${e.swaps.length} swaps`:'';
    h+=`<div class="hist-entry${latest?' latest':''}" style="cursor:pointer" onclick="this.classList.toggle('open')">`;
    const hasSwaps=e.swaps&&e.swaps.length;
    h+=`<div class="hist-meta"><span>iter ${e.iter} <span class="tag">${e.phase}</span>${swapStr}</span></div>`;
    e.results.forEach(r=>{
      const found=r.iters!==null;
      h+=`<div class="solve-row"><div class="solve-name strat-link" data-hi="${i}" data-sn="${r.name}">${r.name}</div>`
        +`<div class="solve-iters ${found?'found':'fail'}">${found?r.iters+'it':'> '+e.max_iter}</div>`
        +`<div class="solve-time">${r.time}s</div></div>`;
    });
    if(hasSwaps){
      h+=`<div class="hist-swaps">`;
      e.swaps.forEach(s=>{h+=`<span class="swap-tag">${s[0]} ↔ ${s[1]}</span>`});
      h+=`</div>`;
    }
    h+=`</div>`;
  }
  body.innerHTML=h;
  body.querySelectorAll('.strat-link').forEach(el=>{
    el.onclick=(ev)=>{ev.stopPropagation();
      viewStrategy(solveHistory[parseInt(el.dataset.hi)],el.dataset.sn)};
  });
}

function doSolve(){
  const btn=document.getElementById('solve-btn');
  if(btn.classList.contains('loading'))return;
  btn.classList.add('loading');btn.textContent='Solving...';
  const body=document.getElementById('hist-body');
  body.insertAdjacentHTML('afterbegin','<div class="solve-loading">Running 4 strategies...</div>');

  fetch('/solve',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({iter:ci,phase:cp,swaps:sandbox.swaps,max_iter:200,source:viewLabel?'strategy':'original'})
  }).then(r=>r.json()).then(entry=>{
    btn.classList.remove('loading');btn.textContent='Solve from here';
    solveHistory.push(entry);
    renderHistory();
  }).catch(err=>{
    btn.classList.remove('loading');btn.textContent='Solve from here';
    body.innerHTML=`<div class="solve-loading" style="color:#f85149">Error: ${err.message}</div>`;
  });
}

function clearHistory(){
  fetch('/history/clear',{method:'POST'}).then(()=>{solveHistory=[];renderHistory()});
}

fetch('/history').then(r=>r.json()).then(h=>{solveHistory=h;renderHistory()});

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();sandboxApply();return}
  if(e.key==='z'&&(e.metaKey||e.ctrlKey)){e.preventDefault();sandboxUndo();return}
  if(e.key==='Escape'){e.preventDefault();sandboxReset();return}
  if(e.key==='ArrowUp'){e.preventDefault();ci=Math.max(0,ci-1);cp='start';sel1=sel2=-1;sandboxReset();return}
  if(e.key==='ArrowDown'){e.preventDefault();ci=Math.min(its.length-1,ci+1);cp='start';sel1=sel2=-1;sandboxReset();return}
  if(e.key==='ArrowRight'){e.preventDefault();const p=['start','swaps','hermite','end'];let i=p.indexOf(cp);if(i<3){cp=p[i+1];sandboxReset()}}
  if(e.key==='ArrowLeft'){e.preventDefault();const p=['start','swaps','hermite','end'];let i=p.indexOf(cp);if(i>0){cp=p[i-1];sandboxReset()}}
});

render();
</script></body></html>
